<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员账号 · 助贷管理后台</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-layout">
  <div class="admin-sidebar" id="app-sidebar"></div>

  <div class="admin-main">
    <div class="page-header">
      <div class="ph-title">管理员账号</div>
      <div class="ph-actions">
        <button class="btn btn-primary btn-sm" id="addAdminBtn" onclick="Page.showAddAdmin()">+ 添加账号</button>
      </div>
    </div>
    <div class="rule-section" style="font-size:13px;color:var(--text-2);">
      管理可登录后台系统的账号。<b>超级管理员</b>可增删改其他账号；<b>普通管理员</b>仅能登录使用后台。
    </div>
    <div class="data-table">
      <table>
        <thead>
          <tr>
            <th>账号</th>
            <th>姓名</th>
            <th>角色</th>
            <th>创建时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="adminTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 添加/编辑管理员弹窗 -->
<div class="modal-overlay" id="addAdminModal">
  <div class="modal">
    <div class="modal-title" id="addAdminTitle">添加管理员账号</div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">登录账号</label>
        <input class="form-input" id="addAdminUsername" placeholder="英文/数字，登录用" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">姓名</label>
        <input class="form-input" id="addAdminName" placeholder="显示名称">
      </div>
      <div class="form-group">
        <label class="form-label">登录密码</label>
        <input class="form-input" id="addAdminPwd" type="text" placeholder="初始密码">
      </div>
      <div class="form-group">
        <label class="form-label">角色</label>
        <select class="form-select" id="addAdminRole">
          <option value="admin">普通管理员（仅登录使用）</option>
          <option value="super">超级管理员（可管理账号）</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="Page.closeAddAdmin()">取消</button>
      <button class="btn btn-primary" onclick="Page.confirmAddAdmin()">确认保存</button>
    </div>
  </div>
</div>

<!-- 修改密码弹窗 -->
<div class="modal-overlay" id="chgPwdModal">
  <div class="modal">
    <div class="modal-title">修改密码</div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">账号</label>
        <div id="chgPwdUsername" style="font-size:15px;font-weight:600;"></div>
      </div>
      <div class="form-group">
        <label class="form-label">新密码</label>
        <input class="form-input" id="chgPwdNew" type="text" placeholder="请输入新密码">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="Page.closeChgPwd()">取消</button>
      <button class="btn btn-primary" onclick="Page.confirmChgPwd()">确认修改</button>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admins.js"></script>
</body>
</html>
