<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 助贷管理后台</title>
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 45%, #4f8cf7 100%);
      padding: 20px;
    }
    .login-card {
      width: 400px;
      max-width: 100%;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    .login-head {
      text-align: center;
      padding: 36px 32px 24px;
      background: linear-gradient(135deg, #f5f8ff, #eef3ff);
      border-bottom: 1px solid #eef0f5;
    }
    .login-logo-img { max-width: 180px; max-height: 72px; object-fit: contain; margin-bottom: 12px; }
    .login-title { font-size: 20px; font-weight: 800; margin-top: 0; color: #1a1a2e; }
    .login-sub { font-size: 13px; color: #8e8e93; margin-top: 4px; }
    .login-body { padding: 28px 32px 32px; }
    .login-error {
      display: none;
      background: #ffeef0; border: 1px solid #ffd7d7; color: #d33;
      font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px;
    }
    .login-field { margin-bottom: 16px; }
    .login-field label { display: block; font-size: 13px; color: #8e8e93; margin-bottom: 6px; }
    .login-field input {
      width: 100%; padding: 12px 14px; border: 1px solid #e8e8ed; border-radius: 8px;
      font-size: 15px; outline: none; transition: border-color .2s;
    }
    .login-field input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .login-btn {
      width: 100%; padding: 13px; border: none; border-radius: 8px; background: #2563eb;
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; transition: background .2s;
    }
    .login-btn:hover { background: #1d4ed8; }
    .login-btn:disabled { background: #9bb6ee; cursor: not-allowed; }
    .login-tip {
      margin-top: 18px; font-size: 12px; color: #8e8e93; text-align: center; line-height: 1.6;
    }
    .login-tip code { background: #f0f2f5; padding: 1px 6px; border-radius: 4px; color: #1d4ed8; }
  </style>
  <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-head">
        <img src="images/logo.png" alt="博晟恒辉" class="login-logo-img">
        <div class="login-title">助贷管理后台</div>
        <div class="login-sub">请使用管理员账号登录</div>
      </div>
      <div class="login-body">
        <div class="login-error" id="loginError"></div>
        <form id="loginForm" autocomplete="off">
          <div class="login-field">
            <label for="username">管理员账号</label>
            <input type="text" id="username" name="username" placeholder="请输入管理员账号" maxlength="32" autocomplete="username">
          </div>
          <div class="login-field">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password">
          </div>
          <button type="submit" class="login-btn" id="loginBtn">登 录</button>
        </form>
        <div class="login-tip">
          管理员账号：<code>admin</code> / 密码 <code>111111</code><br>
          建议登录后修改默认密码
        </div>
      </div>
    </div>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
