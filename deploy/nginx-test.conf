# ==========================================================
# 测试环境 Nginx 站点（前后台共用 bshh_test_db）
#
# 安装：
#   cp deploy/nginx-test.conf /etc/nginx/conf.d/bshh-test.conf
#   nginx -t && systemctl reload nginx
#
# 测试链接：
#   前台 H5  ： http://<公网IP>:9293/
#   后台 PC  ： http://<公网IP>:9294/
#
# ⚠ 别忘了在云服务器安全组放行 9293 / 9294 两个端口。
# ⚠ 后台同样建议配置 IP 白名单或 Basic Auth（参照 deploy/nginx.conf）。
# ==========================================================

# ---------------- 测试前台 H5（反代 9193） ----------------
server {
    listen 9293;
    listen [::]:9293;
    server_name _;

    access_log /var/log/nginx/bshh-test.access.log;
    error_log  /var/log/nginx/bshh-test.error.log;

    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:9193;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:9193;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 双保险：禁止通过 HTTP 读到配置文件
    location ~* (jdy-config\.json|\.env) { deny all; return 403; }
    location ~ /\. { deny all; }
}

# ---------------- 测试后台 PC（反代 9194） ----------------
server {
    listen 9294;
    listen [::]:9294;
    server_name _;

    access_log /var/log/nginx/bshhadmin-test.access.log;
    error_log  /var/log/nginx/bshhadmin-test.error.log;

    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:9194;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:9194;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        proxy_pass http://127.0.0.1:9194;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:9194;
        access_log off;
    }

    # 双保险：禁止通过 HTTP 读到配置文件
    location ~* (jdy-config\.json|\.env) { deny all; return 403; }
    location ~ /\. { deny all; }
}
