# ==========================================================
# bshhadmin 管理后台 —— Nginx 站点配置
#
# 安装：
#   cp deploy/nginx.conf /etc/nginx/conf.d/bshhadmin.conf
#   vi /etc/nginx/conf.d/bshhadmin.conf   # 修改下方标注 ★ 的位置
#   nginx -t && systemctl reload nginx
#
# ⚠ 重要：后台可修改简道云凭证与匹配规则，不应对公网开放。
#         请务必配置下方的 IP 白名单，或启用 Basic Auth。
# ==========================================================

server {
    listen 80;
    listen [::]:80;

    # ★ 改成后台专用域名（建议与前台分开），或填 公网IP
    server_name admin.example.com;

    # ★ 已配置 HTTPS 后，取消下面一行注释
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/bshhadmin.access.log;
    error_log  /var/log/nginx/bshhadmin.error.log;

    client_max_body_size 10m;

    # ================= 访问控制（二选一，建议都开）=================
    #
    # 方式一：IP 白名单 —— 适合公司有固定出口 IP
    # ★ 把下面的 IP 换成你们公司的固定公网 IP（在公司网络下访问 ip.sb 可查）
    #
    # allow 203.0.113.10;      # 公司出口 IP
    # allow 127.0.0.1;         # 本机调试
    # deny  all;
    #
    # 方式二：HTTP Basic Auth —— 适合动态 IP
    # 先在服务器执行生成密码文件：
    #   yum install -y httpd-tools   （Ubuntu: apt install -y apache2-utils）
    #   htpasswd -c /etc/nginx/.htpasswd admin
    #
    # auth_basic           "Restricted Area";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    #
    # ==============================================================

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:9192;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:9192;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        proxy_pass http://127.0.0.1:9192;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:9192;
        access_log off;
    }

    # 双保险：即便应用层出问题，也禁止通过 HTTP 读到配置文件
    location ~* (jdy-config\.json|\.env) {
        deny all;
        return 403;
    }

    location ~ /\. {
        deny all;
    }
}

